services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=${PORT:-5000}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/invest-platform}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey_change_me_in_production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${PRODUCTION_API_URL:-http://localhost:5000}
    ports:
      - "80:80"
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
